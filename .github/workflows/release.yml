# ══════════════════════════════════════════════════════════
# InkVault — build & publication AUTOMATIQUE de la release Linux
#
# Déclenché à chaque tag v* :
#   1. build arm64 puis x64 (AppImage + .tar.gz via electron-builder)
#   2. .deb des deux arches via scripts/make-deb.sh (sans fpm)
#   3. création (ou mise à jour) de la GitHub Release avec les 6 assets
#
# Usage :  npm version patch && git push --follow-tags
# ══════════════════════════════════════════════════════════
name: 📦 Release Linux

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # exécution manuelle depuis l'onglet Actions

permissions:
  contents: write      # créer/mettre à jour la release + uploader les assets

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Node.js 22 (cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 🔎 Vérifier le tag avant le build
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$VER" || { echo "✖ Tag $GITHUB_REF_NAME != v$VER"; exit 1; }

      - name: 📦 Dépendances
        run: npm ci --no-audit --no-fund

      - name: 🧪 Tests
        run: npm test

      # ── arm64 d'abord, puis x64 : séquence éprouvée localement,
      #    les deux arches cohabitent dans dist/ sans s'effacer ──
      - name: 🏗️ Build arm64 (AppImage + tar.gz)
        run: npx electron-builder --linux AppImage tar.gz --arm64 --publish never

      - name: 📦 .deb arm64 (make-deb.sh, sans fpm)
        run: ./scripts/make-deb.sh arm64

      - name: 🏗️ Build x64 (AppImage + tar.gz)
        run: npx electron-builder --linux AppImage tar.gz --x64 --publish never

      - name: 📦 .deb x64 (make-deb.sh, sans fpm)
        run: ./scripts/make-deb.sh x64

      - name: ✅ Vérifier les paquets et métadonnées de mise à jour
        run: |
          set -euo pipefail
          VER="$(node -p "require('./package.json').version")"
          ls -lh dist/*.AppImage dist/*.deb dist/*.tar.gz
          count=$(ls dist/*.AppImage dist/*.deb dist/*.tar.gz | wc -l)
          test "$count" -eq 6 || { echo "✖ $count artefacts au lieu de 6"; exit 1; }
          for arch in x86_64 arm64; do
            image="dist/InkVault-${VER}-linux-${arch}.AppImage"
            metadata="dist/latest-linux.yml"
            if [ "$arch" = arm64 ]; then metadata="dist/latest-linux-arm64.yml"; fi
            test -s "$image" && test -s "$metadata" || { echo "✖ AppImage ou métadonnées $arch absentes"; exit 1; }
            grep -Fq "$(basename "$image")" "$metadata" || { echo "✖ $metadata ne pointe pas vers $image"; exit 1; }
            grep -Eq '^[[:space:]]*sha512:' "$metadata" || { echo "✖ checksum manquant dans $metadata"; exit 1; }
          done

      - name: 🚀 Publication de la release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSETS=(dist/*.AppImage dist/*.deb dist/*.tar.gz
                  dist/latest-linux.yml dist/latest-linux-arm64.yml)
          for extra in dist/*.blockmap; do
            if [ -e "$extra" ]; then ASSETS+=("$extra"); fi
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "✖ La release $TAG existe déjà : créer un nouveau numéro de version plutôt que remplacer des binaires distribués."
            exit 1
          fi
          gh release create "$TAG" "${ASSETS[@]}" \
            --title "InkVault ${TAG}" \
            --generate-notes
